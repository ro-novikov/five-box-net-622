    for (let i = 0; i < N * 4; i++) { const x = quads[i * 3], y = quads[i * 3 + 1]; if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y; }
    const pad = 14, sc = Math.min((W - 2 * pad) / Math.max(1, x1 - x0), (H - 2 * pad) / Math.max(1, y1 - y0)), ox = W / 2 - sc * (x0 + x1) / 2, oy = H / 2 + sc * (y0 + y1) / 2;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, W, H);
    order.sort((a, b) => depth[a] - depth[b]);
    const face = D.boxes[S.box].face;
    for (const i of order) {
      const o = i * 12, ux = quads[o + 3] - quads[o], uy = quads[o + 4] - quads[o + 1], uz = quads[o + 5] - quads[o + 2],
        vx = quads[o + 9] - quads[o], vy = quads[o + 10] - quads[o + 1], vz = quads[o + 11] - quads[o + 2];
      const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx, nn = Math.hypot(nx, ny, nz) || 1;
      const lum = 0.55 + 0.45 * Math.abs((0.3 * nx + 0.5 * ny + 0.81 * nz) / nn);
      const c = S.colour === 'faces' ? hex(FACE[face[i]]) : posCol[i];
      ctx.fillStyle = `rgb(${c.map(v => Math.round(v * lum)).join(',')})`;
      ctx.beginPath();
      for (let k = 0; k < 4; k++) { const X = ox + sc * quads[o + k * 3], Y = oy - sc * quads[o + k * 3 + 1]; k ? ctx.lineTo(X, Y) : ctx.moveTo(X, Y); }
      ctx.closePath(); ctx.fill();
    }
  }
  attachDrag(canvas);
  View.listeners.push(draw);
  new ResizeObserver(draw).observe(canvas);
  return { S, draw };
}

(function () {
  // each net carries the direction of its strip, dir = [dx, dy]; the view is turned so that the flat net is horizontal
  View.pitch = 0.6;
  const heroBox = document.getElementById('hero'), tag = document.getElementById('tag'), thumbs = document.getElementById('thumbs');
  const playBtn = document.getElementById('play'), slider = document.getElementById('t');
  const name = B => B.box.join(' × ');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  // timeline per box (seconds): flat, folding, folded, unfolding
  const FLAT = 1.6, FOLD = 4.8, HOLD = 4.4, UNF = 2.8, END = FLAT + FOLD + HOLD + UNF;
  const smooth = x => x <= 0 ? 0 : x >= 1 ? 1 : x * x * (3 - 2 * x);
  const tOf = s => s < FLAT ? 0 : s < FLAT + FOLD ? smooth((s - FLAT) / FOLD) : s < FLAT + FOLD + HOLD ? 1 : 1 - smooth((s - FLAT - FOLD - HOLD) / UNF);
  let net = 0, cur = 0, tau = 0, t = reduce ? 1 : 0, playing = !reduce, hero, tv = [];
  function build() {
    heroBox.querySelector('canvas')?.remove(); thumbs.innerHTML = '';
    const D = NETS[net], c = document.createElement('canvas'); c.setAttribute('aria-label', 'The net folding into a box'); heroBox.prepend(c);
    const dir = { p: D.dir[0], q: -D.dir[1] }; View.yaw = Math.atan2(-D.dir[1], D.dir[0]);
    hero = Fold3D(c, D, dir);
    tv = D.boxes.map((B, b) => {
      const btn = document.createElement('button'); btn.innerHTML = `<canvas></canvas><span>${name(B)}</span>`; thumbs.appendChild(btn);
      btn.addEventListener('click', () => { cur = b; if (playing) tau = FLAT; else t = 1; render(); });
      const v = Fold3D(btn.querySelector('canvas'), D, dir); v.S.box = b; v.S.t = 1; return { btn, v };
    });
    View.listeners = [render, ...tv.map(x => x.v.draw)]; tv.forEach(x => x.v.draw()); render();
  }
  function setPlay(p) { playing = p; playBtn.textContent = p ? '❚❚' : '▶'; playBtn.setAttribute('aria-label', p ? 'Pause' : 'Play'); }
  function render() {
    if (playing) t = tOf(tau);
    hero.S.box = cur; hero.S.t = t; hero.draw(); slider.value = Math.round(t * 1000);
    tag.textContent = t < 0.02 ? `${NETS[net].cells.length} squares` : name(NETS[net].boxes[cur]);
    tv.forEach(({ btn }, b) => btn.setAttribute('aria-pressed', String(b === cur)));
  }
  playBtn.addEventListener('click', () => { if (!playing) tau = t >= 1 ? FLAT + FOLD : FLAT + FOLD * t; setPlay(!playing); });
  slider.addEventListener('input', () => { setPlay(false); t = slider.value / 1000; render(); });
  const netsBox = document.getElementById('nets');           // one button per net; no switch when there is one net
  if (NETS.length < 2) netsBox.remove();
  else netsBox.innerHTML = NETS.map((_, i) => `<button data-net="${i}" aria-pressed="${i === 0}">Net ${'ABCDEFGH'[i]}</button>`).join('');
  document.querySelectorAll('[data-net]').forEach(el => el.addEventListener('click', () => { net = +el.dataset.net;
    document.querySelectorAll('[data-net]').forEach(e => e.setAttribute('aria-pressed', String(e === el))); build(); }));
  setPlay(playing); build();
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (playing) { tau += dt; if (tau >= END) { tau = 0; cur = (cur + 1) % NETS[net].boxes.length; } render(); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
